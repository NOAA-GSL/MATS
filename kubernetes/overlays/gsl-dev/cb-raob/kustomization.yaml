apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/cb-raob

patches:
  - path: deployment.yaml

images:
  - name: ghcr.io/noaa-gsl/mats/development/cb-raob
    newTag: development

configMapGenerator:
  - name: cb-raob-config
    files:
      - settings.json # Should mirror the appropriate settings.json file in mats-settings

secretGenerator:
  - name: cb-raob-secret
    envs:
      - .env # Should contain mongo_url, root_url, and delay
