apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-raob
spec:
  template:
    spec:
      containers:
        - name: cb-raob
          resources:
            requests:
              memory: "1Gi"
              cpu: "0.25"
            limits:
              memory: "8Gi"
              cpu: "4"
          envFrom:
            - secretRef:
                name: cb-raob-secret
          volumeMounts:
            - name: cb-raob-settings-file
              mountPath: /usr/app/settings/cb-raob/settings.json
              subPath: settings.json
              readOnly: true
          imagePullPolicy: Always  # Since we track a long-lived tag
      imagePullSecrets:
        - name: mats-ghcr
      volumes:
        - name: cb-raob-settings-file
          configMap:
            name: cb-raob-config
