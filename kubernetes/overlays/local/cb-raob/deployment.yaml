apiVersion: apps/v1
kind: Deployment
metadata:
  name: cb-raob
spec:
  template:
    spec:
      containers:
        - name: cb-raob
          # resources:
          #   requests:
          #     memory: "2Gi"
          #     cpu: "1"
          #   limits:
          #     memory: "4Gi"
          #     cpu: "2"
          envFrom:
            - secretRef:
                name: cb-raob-secret
          volumeMounts:
            - name: cb-raob-settings-file
              mountPath: /usr/app/settings/cb-raob/settings.json
              subPath: settings.json
              readOnly: true
      volumes:
        - name: cb-raob-settings-file
          configMap:
            name: cb-raob-config
